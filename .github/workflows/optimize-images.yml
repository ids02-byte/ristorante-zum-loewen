name: Generate optimized restaurant images

on:
  push:
    branches:
      - optimize-website-images-20261124
    paths:
      - scripts/optimize_site_images.py
      - .github/workflows/optimize-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convert restaurant images and update references
        run: python scripts/optimize_site_images.py
      - name: Commit optimized image files and HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img index.html speisekarte.html impressum.html datenschutz.html style.css
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized WebP assets and responsive image references"
            git push origin HEAD:optimize-website-images-20261124
          fi
